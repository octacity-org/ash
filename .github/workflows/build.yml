# Generated by OmniShip from workflow.py. Do not edit directly.
name: Build
'on':
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
  build-package:
    name: Build · Package
    needs: check
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: true
        go-version-file: go.mod
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - name: Run Package
      run: uvx --from omniship==0.6.0 omniship run-node --stage build --node package --config omniship.yaml --export-artifacts .omniship/handoff/build-package
      env:
        CGO_ENABLED: '1'
        CC: ${{ matrix.cc }}
        RELEASE_TARGET: ${{ matrix.target }}
        OMNISHIP_REF_TYPE: ${{ github.ref_type }}
        OMNISHIP_REF_NAME: ${{ github.ref_name }}
        OMNISHIP_REVISION: ${{ github.sha }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: omniship-build-build-package.${{ strategy.job-index }}
        path: .omniship/handoff/build-package
        include-hidden-files: true
        retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04-arm
        - ubuntu-24.04
        - windows-2022
        - macos-15
        include:
        - runner: ubuntu-24.04-arm
          target: linux-arm64
          goos: linux
          goarch: arm64
          cc: gcc
        - runner: ubuntu-24.04
          target: linux-amd64
          goos: linux
          goarch: amd64
          cc: gcc
        - runner: windows-2022
          target: windows-amd64
          goos: windows
          goarch: amd64
          cc: gcc
        - runner: macos-15
          target: macos-arm64
          goos: darwin
          goarch: arm64
          cc: clang
  build-checksums:
    name: Build · Checksums
    needs: build-package
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: omniship-build-build-package.*
        path: .omniship/imports/build-package
    - name: Run Checksums
      run: uvx --from omniship==0.6.0 omniship run-node --stage build --node checksums --config omniship.yaml --import-artifacts-root .omniship/imports --export-artifacts .omniship/handoff/build-checksums
      env:
        OMNISHIP_REF_TYPE: ${{ github.ref_type }}
        OMNISHIP_REF_NAME: ${{ github.ref_name }}
        OMNISHIP_REVISION: ${{ github.sha }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: omniship-build-build-checksums
        path: .omniship/handoff/build-checksums
        include-hidden-files: true
        retention-days: 7
  build-complete:
    name: Build complete
    needs: build-checksums
    runs-on: ubuntu-24.04
    steps:
    - run: echo 'build stage complete'
