# Generated by OmniShip from workflow.py. Do not edit directly.
name: Check
'on':
  push:
    branches:
    - '**'
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  prepare:
    name: Check · Prepare
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - run: uvx --from omniship==0.6.0 omniship generate --check
  check-build-and-test:
    name: Build and test (${{ matrix.target }})
    needs: prepare
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: true
        go-version-file: go.mod
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - name: Run Build And Test
      run: uvx --from omniship==0.6.0 omniship run-node --stage check --node build-and-test --config omniship.yaml
      env:
        CGO_ENABLED: '1'
        CC: ${{ matrix.cc }}
        EXPECTED_GOOS: ${{ matrix.goos }}
        EXPECTED_GOARCH: ${{ matrix.goarch }}
        OMNISHIP_REF_TYPE: ${{ github.ref_type }}
        OMNISHIP_REF_NAME: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04-arm
        - ubuntu-24.04
        - windows-2022
        - macos-15
        include:
        - runner: ubuntu-24.04-arm
          target: linux-arm64
          goos: linux
          goarch: arm64
          cc: gcc
        - runner: ubuntu-24.04
          target: linux-amd64
          goos: linux
          goarch: amd64
          cc: gcc
        - runner: windows-2022
          target: windows-amd64
          goos: windows
          goarch: amd64
          cc: gcc
        - runner: macos-15
          target: macos-arm64
          goos: darwin
          goarch: arm64
          cc: clang
  check-complete:
    name: Check complete
    needs: check-build-and-test
    runs-on: ubuntu-24.04
    steps:
    - run: echo 'check stage complete'
